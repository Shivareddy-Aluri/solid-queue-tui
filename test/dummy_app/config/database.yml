default: &default
  adapter: postgresql
  encoding: unicode
  pool: 20

development:
  primary:
    <<: *default
    database: solid_queue_tui_dev
  queue:
    <<: *default
    database: solid_queue_tui_dev
    migrations_paths: db/queue_migrate

test:
  primary:
    <<: *default
    database: solid_queue_tui_test
  queue:
    <<: *default
    database: solid_queue_tui_test
    migrations_paths: db/queue_migrate
