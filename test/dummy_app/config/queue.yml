default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "urgent"
      threads: 2
      polling_interval: 0.5
    - queues: "default,mailers"
      threads: 3
      polling_interval: 0.5
    - queues: "reports,low_priority"
      threads: 2
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
